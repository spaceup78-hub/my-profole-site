<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산기</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d1f24;
    --muted: #8a8f99;
    --key: #ffffff;
    --key-op: #e8ecf3;
    --key-accent: #4f7cff;
    --key-accent-text: #ffffff;
    --shadow: rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --panel: #1e2127;
      --text: #f1f3f7;
      --muted: #7d8491;
      --key: #2a2e36;
      --key-op: #343945;
      --key-accent: #5b8cff;
      --key-accent-text: #ffffff;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --panel: #1e2127;
    --text: #f1f3f7;
    --muted: #7d8491;
    --key: #2a2e36;
    --key-op: #343945;
    --key-accent: #5b8cff;
    --key-accent-text: #ffffff;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  .calc {
    width: 100%;
    max-width: 340px;
    padding: 20px;
    border-radius: 24px;
    background: var(--panel);
    box-shadow: 0 10px 30px var(--shadow);
  }

  .screen {
    min-height: 120px;
    padding: 8px 4px 16px;
    text-align: right;
    overflow: hidden;
  }

  .history {
    min-height: 20px;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .display {
    margin-top: 6px;
    font-size: 44px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    height: 68px;
    border: none;
    border-radius: 18px;
    background: var(--key);
    color: var(--text);
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 1px 2px var(--shadow);
    transition: transform 0.05s, filter 0.1s;
  }
  button:hover { filter: brightness(0.97); }
  button:active { transform: scale(0.96); }
  button.op { background: var(--key-op); }
  button.accent { background: var(--key-accent); color: var(--key-accent-text); }
  button.zero { grid-column: span 2; }
</style>
</head>
<body>
  <main class="calc">
    <section class="screen">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>
    </section>

    <section class="keys">
      <button class="op" data-key="C">C</button>
      <button class="op" data-key="Backspace">⌫</button>
      <button class="op" data-key="%">%</button>
      <button class="op" data-key="/">÷</button>

      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="op" data-key="*">×</button>

      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="op" data-key="-">−</button>

      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="op" data-key="+">+</button>

      <button class="zero" data-key="0">0</button>
      <button data-key=".">.</button>
      <button class="accent" data-key="=">=</button>
    </section>
  </main>

<script>
  const display = document.getElementById('display');
  const history = document.getElementById('history');
  const OPERATORS = ['+', '-', '*', '/'];

  let expr = '';            // 입력 중인 수식 (내부 표기: 0-9 . + - * /)
  let justEvaluated = false; // 직전에 = 를 눌렀는지 여부

  // ---------- 계산 로직 ----------

  function tokenize(s) {
    return s.match(/\d+\.?\d*|[+\-*/]/g) || [];
  }

  // TODO(human): 아래 evaluate()는 임시로 "왼쪽에서 오른쪽으로" 계산하는 버전입니다.
  // 수학 규칙(곱셈·나눗셈 우선)을 지키는 버전으로 바꿔 주세요.
  // 입력은 tokenize()가 만든 문자열 토큰 배열이며, 맨 앞에 음수 기호는 오지 않습니다(0- 로 처리됨).
  // 0으로 나누면 Error를 던져야 합니다.
  function evaluate(tokens) {
    let result = Number(tokens[0]);
    for (let i = 1; i < tokens.length; i += 2) {
      const op = tokens[i];
      const n = Number(tokens[i + 1]);
      if (op === '+') result += n;
      else if (op === '-') result -= n;
      else if (op === '*') result *= n;
      else if (op === '/') {
        if (n === 0) throw new Error('0으로 나눌 수 없습니다');
        result /= n;
      }
    }
    return result;
  }

  // 부동소수점 오차(예: 0.1 + 0.2)를 화면에서 정리
  function formatNumber(n) {
    return String(Number(n.toPrecision(12)));
  }

  function toDisplay(s) {
    return s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
  }

  // ---------- 입력 처리 ----------

  const lastNumber = () => (expr.match(/\d*\.?\d*$/) || [''])[0];
  const isOperator = (ch) => OPERATORS.includes(ch);

  function startNewIfEvaluated() {
    if (justEvaluated) {
      expr = '';
      justEvaluated = false;
      history.textContent = '';
    }
  }

  function inputDigit(d) {
    startNewIfEvaluated();
    const cur = lastNumber();
    if (cur.replace('.', '').length >= 15) return;
    if (cur === '0') expr = expr.slice(0, -1) + d; // 0 뒤에 숫자가 오면 0 대체
    else expr += d;
    render();
  }

  function inputDot() {
    startNewIfEvaluated();
    const cur = lastNumber();
    if (cur.includes('.')) return;
    expr += cur === '' ? '0.' : '.';
    render();
  }

  function inputOperator(op) {
    if (justEvaluated) {
      justEvaluated = false;
      history.textContent = '';
    }
    if (expr === '') {
      if (op === '-') expr = '0-'; // 맨 앞의 '-'는 음수 대신 0- 로 시작
      render();
      return;
    }
    const last = expr.slice(-1);
    expr = isOperator(last) ? expr.slice(0, -1) + op : expr + op;
    render();
  }

  function equals() {
    if (expr === '' || isOperator(expr.slice(-1))) return;
    const original = expr;
    try {
      const result = evaluate(tokenize(expr));
      if (!Number.isFinite(result)) throw new Error('계산할 수 없는 결과입니다');
      history.textContent = toDisplay(original) + ' =';
      expr = formatNumber(result);
      if (result < 0) expr = '0' + expr; // 음수 결과는 0-N 형태로 보관
      justEvaluated = true;
    } catch (err) {
      expr = '';
      justEvaluated = false;
      history.textContent = err.message;
    }
    render();
  }

  function percent() {
    const cur = lastNumber();
    if (cur === '') return;
    expr = expr.slice(0, -cur.length) + formatNumber(parseFloat(cur) / 100);
    render();
  }

  function backspace() {
    if (justEvaluated) return clearAll();
    expr = expr.slice(0, -1);
    render();
  }

  function clearAll() {
    expr = '';
    justEvaluated = false;
    history.textContent = '';
    render();
  }

  function render() {
    display.textContent = toDisplay(expr) || '0';
  }

  function press(key) {
    if (key === 'C') return clearAll();
    if (key === 'Backspace') return backspace();
    if (key === '=') return equals();
    if (key === '%') return percent();
    if (key === '.') return inputDot();
    if (/^\d$/.test(key)) return inputDigit(key);
    if (isOperator(key)) return inputOperator(key);
  }

  // ---------- 이벤트 연결 ----------

  document.querySelectorAll('button[data-key]').forEach((btn) => {
    btn.addEventListener('click', () => press(btn.dataset.key));
  });

  const KEY_ALIASES = { Enter: '=', Escape: 'C', c: 'C', C: 'C', ',': '.' };

  document.addEventListener('keydown', (e) => {
    const key = KEY_ALIASES[e.key] || e.key;
    if (key === 'C' || key === 'Backspace' || key === '=' || key === '%' ||
        key === '.' || /^\d$/.test(key) || OPERATORS.includes(key)) {
      e.preventDefault();
      press(key);
    }
  });

  render();
</script>
</body>
</html>
